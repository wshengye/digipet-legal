<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Digipet — Confirmation Issue</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; padding: 0; background: #001528; color: #F4F4F2; }
  body { font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  main { max-width: 480px; margin: 0 auto; padding: 80px 24px; text-align: center; }
  .warn {
    width: 64px; height: 64px; margin: 0 auto 24px;
    border-radius: 50%; background: #FBBF24;
    display: flex; align-items: center; justify-content: center;
  }
  .warn svg { width: 32px; height: 32px; }
  h1 { margin: 0 0 12px; font-size: 22px; letter-spacing: 0.04em; text-transform: uppercase; color: #FBBF24; }
  p { font-size: 15px; line-height: 1.6; color: #F4F4F2; margin: 0 0 16px; }
  .hint { font-size: 13px; color: #6B7F94; }
  footer.page { margin-top: 48px; padding-top: 16px; border-top: 1px solid rgba(255,255,255,0.08); font-size: 12px; color: #6B7F94; }
  footer.page a { color: #8FA3B8; text-decoration: none; }
</style>
</head>
<body>
<main>
  <div class="warn">
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 8v5M12 17h.01M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"
            stroke="#001528" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>
  <h1 id="title">Link Issue</h1>
  <p id="message">This confirmation link is no longer valid.</p>
  <p class="hint">Open the Digipet app and sign in again to get a fresh email.</p>
  <footer class="page">
    <a href="./index.html">Digipet legal &amp; privacy</a>
  </footer>
</main>
<script>
  // The Edge Function passes ?reason=<code> so this page can show the
  // user-friendly message for what went wrong. Codes are kept in sync
  // with supabase/functions/confirm-device-claim/index.ts.
  (function () {
    const reasons = {
      invalid:    { title: 'Invalid link',    message: 'This confirmation link is malformed.' },
      notfound:   { title: 'Link not found',  message: 'This confirmation link is invalid or has already been used.' },
      expired:    { title: 'Link expired',    message: 'This confirmation link has expired (links are valid for 24 hours).' },
      cancelled:  { title: 'Link cancelled',  message: 'You started a newer sign-in on another device, which cancelled this one. Use the most recent email you received.' },
      partial:    { title: 'Partial confirm', message: 'Your device is confirmed, but we hit a snag finalising it. If your other devices keep staying signed in, please contact support.' },
      error:      { title: 'Something went wrong', message: 'Please try again in a moment.' },
    };
    const params = new URLSearchParams(window.location.search);
    const reason = params.get('reason') || 'error';
    const info = reasons[reason] || reasons.error;
    document.getElementById('title').textContent = info.title;
    document.getElementById('message').textContent = info.message;
  })();
</script>
</body>
</html>
